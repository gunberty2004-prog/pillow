<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pillow App</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase Web SDK v9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center sm:p-4">

    <!-- Mobile Screen Frame Container -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[38px] shadow-2xl relative flex flex-col overflow-hidden">

        <!-- ========================================================= -->
        <!-- APP TOP HEADER (Gradient Sky Blue Style) -->
        <!-- ========================================================= -->
        <div class="bg-gradient-to-r from-blue-600 via-blue-500 to-sky-400 pt-10 pb-14 px-6 text-white shadow-md relative">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold tracking-tight">Device</h1>
                <div class="flex items-center space-x-5 text-xl">
                    <button class="hover:opacity-80 transition"><i class="fa-solid fa-border-all"></i></button>
                    <button class="hover:opacity-80 transition"><i class="fa-solid fa-headset"></i></button>
                    <button onclick="toggleConnectModal()" class="hover:scale-110 transition active:scale-95">
                        <i class="fa-solid fa-circle-plus text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- MAIN CONTENT AREA (Overlapping Card) -->
        <!-- ========================================================= -->
        <div class="-mt-8 px-4 flex-1 space-y-4 pb-24 overflow-y-auto">

            <!-- DEVICE CARD (Yoosee App Style) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                
                <!-- Card Header -->
                <div class="p-4 flex justify-between items-center border-b border-slate-50">
                    <div class="flex items-center space-x-2">
                        <h2 id="device-title" class="font-bold text-slate-800 text-lg">Smart Pillow 01</h2>
                        <span id="connection-badge" class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-[10px] font-bold rounded-full flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Online
                        </span>
                    </div>
                    <div class="flex items-center space-x-3 text-slate-400">
                        <button class="hover:text-blue-600"><i class="fa-solid fa-share-nodes"></i></button>
                        <button onclick="toggleConnectModal()" class="hover:text-blue-600"><i class="fa-solid fa-gear"></i></button>
                    </div>
                </div>

                <!-- Media/Monitor Box (แทนหน้าจอกล้องวงจรปิด) -->
                <div class="relative bg-slate-900 h-52 flex flex-col justify-between p-4 text-white overflow-hidden">
                    
                    <!-- Top Info overlay -->
                    <div class="flex justify-between items-center text-xs text-slate-300 z-10">
                        <span class="bg-black/40 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10 font-mono">
                            <i class="fa-solid fa-microphone text-sky-400 mr-1"></i> Sound Rate
                        </span>
                        <span class="bg-red-500/80 text-white font-bold px-2 py-0.5 rounded text-[10px] tracking-wider animate-pulse">
                            ● LIVE
                        </span>
                    </div>

                    <!-- Decibel Big Center Value -->
                    <div class="text-center my-auto z-10">
                        <div class="flex items-baseline justify-center gap-1">
                            <span id="db-value" class="text-6xl font-black tracking-tight text-white drop-shadow-md">0.0</span>
                            <span class="text-lg font-semibold text-sky-400">dB</span>
                        </div>
                        <p id="sound-status-text" class="text-xs text-slate-300 mt-1 font-medium">Quiet Environment</p>
                    </div>

                    <!-- Posture Bar Overlay -->
                    <div class="z-10 flex justify-between items-center bg-black/50 backdrop-blur-md px-3 py-2 rounded-xl border border-white/10 text-xs">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-bed text-sky-400"></i>
                            <span id="posture-text" class="font-semibold text-slate-100">Supine (Back)</span>
                        </div>
                        <span id="posture-angles" class="text-[10px] text-slate-400 font-mono">P: 0.0° | R: 0.0°</span>
                    </div>

                    <!-- Ambient Background Gradient inside display box -->
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/60 to-slate-900/20"></div>
                </div>

                <!-- Action Buttons Row (สไตล์ Cloud Storage / Playback ในรูป) -->
                <div class="grid grid-cols-2 gap-2 p-3 bg-slate-50/50 border-t border-slate-100">
                    
                    <!-- Action Button 1: Vibration Status -->
                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex items-center space-x-3 shadow-2xs">
                        <div id="vibe-icon-box" class="w-9 h-9 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-vibrating-alarm text-base"></i>
                        </div>
                        <div class="overflow-hidden">
                            <div class="flex items-center gap-1">
                                <span id="vibe-badge" class="px-1.5 py-0.2 bg-slate-100 text-slate-600 text-[9px] font-bold rounded">
                                    Inactive
                                </span>
                            </div>
                            <p id="vibe-title" class="text-xs font-bold text-slate-700 mt-0.5 truncate">Vibration Off</p>
                        </div>
                    </div>

                    <!-- Action Button 2: Posture Tracker -->
                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex items-center space-x-3 shadow-2xs">
                        <div class="w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-user-doctor text-base"></i>
                        </div>
                        <div class="overflow-hidden">
                            <span class="px-1.5 py-0.2 bg-indigo-50 text-indigo-600 text-[9px] font-bold rounded">
                                IMU Sensor
                            </span>
                            <p class="text-xs font-bold text-slate-700 mt-0.5 truncate">Posture Track</p>
                        </div>
                    </div>

                </div>

                <!-- Real-Time Sound Graph inside Card -->
                <div class="p-4 space-y-2 border-t border-slate-100">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-700 uppercase tracking-wider text-[11px]">Sound Rate Graph</span>
                        <span class="text-[10px] text-slate-400">Real-time dB Log</span>
                    </div>
                    <div class="w-full h-36">
                        <canvas id="soundChart"></canvas>
                    </div>
                </div>

            </div>

        </div>

        <!-- ========================================================= -->
        <!-- CONNECT DEVICE MODAL (POPUP) -->
        <!-- ========================================================= -->
        <div id="connect-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-base">Connect Pillow Device</h3>
                    <button onclick="toggleConnectModal()" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-500">Device ID / Name</label>
                    <input type="text" id="device-id-input" placeholder="e.g. PILLOW-001" 
                        class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl font-semibold text-slate-800 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="connectPillow()" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md text-sm transition">
                    Save & Connect
                </button>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- BOTTOM NAVIGATION BAR (Yoosee Bottom Bar Style) -->
        <!-- ========================================================= -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-2.5 flex justify-around items-center z-40">
            
            <!-- Tab 1: Yoosee/Device -->
            <button class="flex flex-col items-center space-y-1 text-blue-600">
                <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-mattress-pillow"></i>
                </div>
                <span class="text-[10px] font-bold">Pillow</span>
            </button>

            <!-- Tab 2: Events -->
            <button class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-shield-halved text-lg"></i>
                <span class="text-[10px] font-medium">Events</span>
            </button>

            <!-- Tab 3: Account -->
            <button class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600">
                <div class="relative">
                    <i class="fa-solid fa-user text-lg"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </div>
                <span class="text-[10px] font-medium">Account</span>
            </button>

        </div>

    </div>

    <!-- JavaScript Section -->
    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            databaseURL: "https://mon-tay2-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // UI Elements
        const dbValueEl = document.getElementById('db-value');
        const soundStatusText = document.getElementById('sound-status-text');
        const postureTextEl = document.getElementById('posture-text');
        const postureAnglesEl = document.getElementById('posture-angles');
        const vibeTitle = document.getElementById('vibe-title');
        const vibeBadge = document.getElementById('vibe-badge');
        const vibeIconBox = document.getElementById('vibe-icon-box');
        const deviceTitle = document.getElementById('device-title');
        const connectModal = document.getElementById('connect-modal');

        let soundChart = null;

        // 2. Chart.js Setup
        function initChart() {
            const ctx = document.getElementById('soundChart').getContext('2d');
            soundChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Sound Level (dB)',
                        data: [],
                        borderColor: '#2563eb', // Blue-600
                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 30, max: 100, grid: { color: '#f1f5f9' } },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Modal Controls
        function toggleConnectModal() {
            connectModal.classList.toggle('hidden');
        }

        function connectPillow() {
            const inputVal = document.getElementById('device-id-input').value.trim();
            if(inputVal) deviceTitle.innerText = inputVal;
            toggleConnectModal();
        }

        // 3. Realtime Firebase Listener
        function listenFirebase() {
            database.ref('pillow').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) updateUI(data);
            });
        }

        // 4. Update UI
        function updateUI(data) {
            // Decibel
            const db = parseFloat(data.db || 0).toFixed(1);
            dbValueEl.innerText = db;
            if (db > 50) {
                soundStatusText.innerText = "Snoring / Loud Noise Detected";
                soundStatusText.className = "text-xs text-rose-400 font-semibold mt-1 animate-pulse";
            } else {
                soundStatusText.innerText = "Quiet Environment";
                soundStatusText.className = "text-xs text-slate-300 mt-1 font-medium";
            }

            // Vibration Status
            if (data.isVibrating || db > 50) {
                vibeTitle.innerText = "Vibrating...";
                vibeBadge.innerText = "Active";
                vibeBadge.className = "px-1.5 py-0.2 bg-rose-500 text-white text-[9px] font-bold rounded animate-pulse";
                vibeIconBox.className = "w-9 h-9 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center shrink-0";
            } else {
                vibeTitle.innerText = "Vibration Off";
                vibeBadge.innerText = "Inactive";
                vibeBadge.className = "px-1.5 py-0.2 bg-slate-100 text-slate-600 text-[9px] font-bold rounded";
                vibeIconBox.className = "w-9 h-9 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center shrink-0";
            }

            // Sleeping Posture
            const pitch = (data.pitch || 0).toFixed(1);
            const roll = (data.roll || 0).toFixed(1);
            postureAnglesEl.innerText = `P: ${pitch}° | R: ${roll}°`;

            let posture = "Supine (Back)";
            if (roll > 20) posture = "Right Side";
            else if (roll < -20) posture = "Left Side";
            else if (pitch > 20) posture = "Head Up / Prone";
            else if (pitch < -20) posture = "Head Down";
            postureTextEl.innerText = posture;

            // Chart Update
            if (soundChart) {
                const time = new Date().toLocaleTimeString();
                soundChart.data.labels.push(time);
                soundChart.data.datasets[0].data.push(db);
                if (soundChart.data.labels.length > 15) {
                    soundChart.data.labels.shift();
                    soundChart.data.datasets[0].data.shift();
                }
                soundChart.update();
            }
        }

        // Init App
        window.onload = () => {
            initChart();
            listenFirebase();
        };
    </script>
</body>
</html>
