<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pillow Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; padding: 25px 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; }
        .card-header { background: #ffffff; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 1.3rem; font-weight: 700; color: #111827; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; }
        .card-title { font-size: 0.85rem; color: #6b7280; margin-bottom: 8px; font-weight: 600; }
        .card-value { font-size: 2rem; font-weight: 800; color: #111827; }
        .status-vibe { padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; display: inline-block; margin-top: 5px; }
        .vibe-on { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .vibe-off { background: #f3f4f6; color: #6b7280; }
    </style>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="card-header">
            <div class="title"><i class="fa-solid fa-bed"></i> Smart Pillow System</div>
            <div class="badge" id="deviceIdTag">PILLOW-089</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-title">ระดับเสียงกรน</div>
                <div class="card-value" id="valDb">0.0 <span style="font-size: 1rem; font-weight: 500;">dB</span></div>
            </div>
            <div class="card">
                <div class="card-title">สถานะการสั่นเตือน</div>
                <div id="valVibrating"><span class="status-vibe vibe-off">ปกติ (ไม่สั่น)</span></div>
            </div>
            <div class="card">
                <div class="card-title">มุมก้ม-เงย (Pitch)</div>
                <div class="card-value" id="valPitch">0.0°</div>
            </div>
            <div class="card">
                <div class="card-title">มุมเอียงซ้าย-ขวา (Roll)</div>
                <div class="card-value" id="valRoll">0.0°</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://mon-tay2-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Path ชี้ตรงไปที่ /devices/PILLOW-089
        const targetDeviceId = "PILLOW-089";
        const pillowRef = database.ref('/devices/' + targetDeviceId);

        pillowRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('valDb').innerHTML = (data.db !== undefined ? Number(data.db).toFixed(1) : '0.0') + ' <span style="font-size: 1rem; font-weight: 500;">dB</span>';
                document.getElementById('valPitch').innerText = (data.pitch !== undefined ? Number(data.pitch).toFixed(1) : '0.0') + '°';
                document.getElementById('valRoll').innerText = (data.roll !== undefined ? Number(data.roll).toFixed(1) : '0.0') + '°';

                const vibeElem = document.getElementById('valVibrating');
                if (data.isVibrating) {
                    vibeElem.innerHTML = '<span class="status-vibe vibe-on">⚡ กำลังสั่นเตือน</span>';
                } else {
                    vibeElem.innerHTML = '<span class="status-vibe vibe-off">ปกติ (ไม่สั่น)</span>';
                }
            }
        });
    </script>
</body>
</html>
