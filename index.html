<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pillow Dashboard</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Web SDK v9 (Compat version เพื่อใส่ง่ายในไฟล์เดียว) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #E8F5E9; /* Background โทนเขียวอ่อนแบบในภาพ */
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="w-full max-w-md mx-auto space-y-5">
        
        <!-- Header Profile & Title Card -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-100 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500 text-white flex items-center justify-center text-xl shadow-md">
                    <i class="fa-solid fa-mattress-pillow"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Smart Pillow</h1>
                    <p class="text-xs text-gray-400">ระบบตรวจจับและเตือนการกรน</p>
                </div>
            </div>
            <div id="connection-badge" class="px-3 py-1 bg-gray-100 text-gray-500 rounded-full text-xs font-medium flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-gray-400" id="status-dot"></span>
                <span id="status-text">Disconnect</span>
            </div>
        </div>

        <!-- Main Sound dB Card (Hero Card) -->
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-lg shadow-emerald-500/20 relative overflow-hidden">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-emerald-100 text-sm font-light">ความดังเสียงปัจจุบัน</p>
                    <div class="flex items-baseline gap-1 my-2">
                        <span id="db-value" class="text-6xl font-extrabold tracking-tight">0.0</span>
                        <span class="text-xl font-medium text-emerald-100">dB</span>
                    </div>
                </div>
                <div class="p-3 bg-white/10 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid fa-microphone-lines text-2xl text-emerald-100"></i>
                </div>
            </div>

            <!-- Sound Level Meter Bar -->
            <div class="mt-4">
                <div class="flex justify-between text-xs text-emerald-100 mb-1">
                    <span>เกณฑ์เงียบ (<50)</span>
                    <span>เกณฑ์กรน (>50 dB)</span>
                </div>
                <div class="w-full bg-black/20 rounded-full h-3 p-0.5 backdrop-blur-sm">
                    <div id="db-bar" class="bg-white h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Grid Cards: Motor Status & Pillow Angle -->
        <div class="grid grid-cols-2 gap-4">
            
            <!-- Vibration Status Card -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-gray-400 font-medium">มอเตอร์สั่น</span>
                    <div id="vibe-icon-bg" class="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center text-gray-400">
                        <i class="fa-solid fa-vibrating-alarm"></i>
                    </div>
                </div>
                <div>
                    <p id="vibe-status" class="text-lg font-bold text-gray-700">ปกติ</p>
                    <p id="vibe-subtext" class="text-xs text-gray-400 mt-0.5">ไม่มีการสั่นเตือน</p>
                </div>
            </div>

            <!-- Pillow Angle Card -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-gray-400 font-medium">องศาหมอน (IMU)</span>
                    <div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-400">Pitch (ก้ม-เงย):</span>
                        <span id="pitch-val" class="font-bold text-gray-700">0.0°</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-400">Roll (เอียง):</span>
                        <span id="roll-val" class="font-bold text-gray-700">0.0°</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Log Activity Card -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100">
            <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-emerald-500"></i>
                การทำงานล่าสุด
            </h3>
            <p id="system-log" class="text-xs text-gray-500 bg-emerald-50/50 p-3 rounded-2xl border border-emerald-100">
                รอเชื่อมต่อข้อมูลจาก Firebase...
            </p>
        </div>

    </div>

    <!-- Firebase JavaScript Configuration -->
    <script>
        // -------------------------------------------------------------
        // 1. ตั้งค่า Firebase Config (เปลี่ยน DATABASE_URL เป็นของคุณ)
        // -------------------------------------------------------------
        const firebaseConfig = {
            databaseURL: "https://mon-tay2-default-rtdb.asia-southeast1.firebasedatabase.app/" // ใส่ URL ของคุณ
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // DOM Elements
        const dbValueEl = document.getElementById('db-value');
        const dbBarEl = document.getElementById('db-bar');
        const vibeStatusEl = document.getElementById('vibe-status');
        const vibeSubtextEl = document.getElementById('vibe-subtext');
        const vibeIconBgEl = document.getElementById('vibe-icon-bg');
        const pitchValEl = document.getElementById('pitch-val');
        const rollValEl = document.getElementById('roll-val');
        const systemLogEl = document.getElementById('system-log');
        const statusDotEl = document.getElementById('status-dot');
        const statusTextEl = document.getElementById('status-text');

        // -------------------------------------------------------------
        // 2. รับค่าข้อมูลจาก Firebase แบบ Realtime (node: /pillow)
        // -------------------------------------------------------------
        database.ref('pillow').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                // อัปเดตสถานะการเชื่อมต่อ
                statusDotEl.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                statusTextEl.innerText = "Live Online";

                // 1. อัปเดตค่า dB และ Sound Bar
                const db = parseFloat(data.db || 0).toFixed(1);
                dbValueEl.innerText = db;
                
                let barPercentage = Math.min((db / 100) * 100, 100);
                dbBarEl.style.width = barPercentage + '%';

                // 2. อัปเดตสถานะสั่นเตือน
                if (data.isVibrating || db > 50) {
                    vibeStatusEl.innerText = "กำลังสั่นเตือน!";
                    vibeStatusEl.className = "text-lg font-bold text-rose-500 animate-bounce";
                    vibeSubtextEl.innerText = "ตรวจพบเสียงกรนดังเกินเกณฑ์";
                    vibeIconBgEl.className = "w-8 h-8 rounded-xl bg-rose-100 text-rose-500";
                } else {
                    vibeStatusEl.innerText = "ปกติ";
                    vibeStatusEl.className = "text-lg font-bold text-gray-700";
                    vibeSubtextEl.innerText = "ไม่มีการสั่นเตือน";
                    vibeIconBgEl.className = "w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600";
                }

                // 3. อัปเดตองศา IMU
                pitchValEl.innerText = (data.pitch || 0).toFixed(1) + '°';
                rollValEl.innerText = (data.roll || 0).toFixed(1) + '°';

                // 4. บันทึก Log
                const time = new Date().toLocaleTimeString();
                systemLogEl.innerText = `[${time}] อัปเดตข้อมูล: เสียง ${db} dB | Pitch: ${(data.pitch || 0).toFixed(1)}°`;
            }
        }, (error) => {
            statusDotEl.className = "w-2 h-2 rounded-full bg-rose-500";
            statusTextEl.innerText = "Error";
            systemLogEl.innerText = "เกิดข้อผิดพลาดในการดึงข้อมูลจาก Firebase";
        });
    </script>
</body>
</html>
